name: "test"
random_seed: 3074

environment:
  batch_size: 2048
  grid_size: 3 
  max_steps: 32 
  num_agents: 2

agents:
  types:
    - "reciprocator"
    - "naive_learner"
  n_latent_var: 16
  lr: 0.005
  gamma: 0.96
  K_epochs: 40
  eps_clip: 0.15
  entropy_weight: 0.01
  rnn: True

reciprocator:
  reciprocal_reward_type: "petty_payoff"
  reciprocal_reward_weight: 1.0 
  normalize_reciprocal_reward: False 

influence:
  rnn: False
  n_latent_var: 32
  lr: 0.01
  num_initialization_episodes: 1  # Freeze policies at start and let influence model learn
  target_period: 1
  target_epochs: 20
  target_buffer_size: 4
  target_batch_size: 4096
  num_train_batches: 64
  parallel_trainers: 1 

logs:
  checkpoint_interval: 10
